<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">

    <title>trainer-wiki</title>
</head>
<body>
    <main>
        <div class="trainerdex">
            <div class="trainerdex-content">
                <img src="./img/trainerdex.png" alt="trainerdex imagem">
            </div>
            <!--=================PERFIL DO TREINADOR===================-->
            <div class="sprite-treinador">
                <img id="treinador-sprite" src="./img/cynthia.png" alt="Cynthia">
            </div>
            <!--=================NOME DO TREINADOR=====================-->
            <div class="name-treinador">
                <h1 id="treinador-name">Cynthia</h1>
            </div>
            <!--====================TIME DO TREINADOR==================-->
            <div class="team-treinador" id="treinador-team">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/442.png" alt="Spiritomb">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/407.png" alt="Roserade">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/468.png" alt="Togekiss">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/448.png" alt="Lucario">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/350.png" alt="Milotic">
                <img src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/445.png" alt="Garchomp">
            </div>
            <!--====================REGIAO E CARGO====================-->
            <div class="region-treinador">
                <span id="treinador-region">SINNOH</span>
            </div>
            <div class="class-treinador">
                <span id="treinador-class">CAMPEÃ</span>
            </div>
            <!--====================CONTROLES D-PAD====================-->
            <button id="btn-prev" class="btn-dpad btn-left" title="Treinador Anterior">◀</button>
            <button id="btn-next" class="btn-dpad btn-right" title="Próximo Treinador">▶</button>   
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
